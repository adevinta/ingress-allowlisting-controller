name: build images

on:
  workflow_call:
  # Started by release-pending.yaml for a main commit no push event built.
  workflow_dispatch:
  push:
    branches: [ "*", "**/*" ]
    # A release tag pushed by hand (a new minor or major) gets its image tag and release.
    tags: [ "v*" ]
# we have to build always if images are attached to commit
#   paths-ignore:
#     - 'docs/**'
#     - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  buildImages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6
      with:
        go-version-file: './go.mod'

    - name: Set up Docker context for Buildx
      id: buildx-context
      run: |
        docker context create builders
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: latest
        endpoint: builders

    - name: Login to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build images
      id: buildimages
      run: |
        img=ghcr.io/${{github.repository}}:${{github.sha}}
        echo "IMAGE_NAME=${img}" >> "$GITHUB_OUTPUT"
        docker pull ${img} || (
          docker buildx build --push --cache-to type=gha,mode=max --cache-from type=gha --progress plain --platform linux/arm64/v8,linux/amd64 --build-arg BUILDKIT_INLINE_CACHE=1 -t ${img}  .
        )

    - name: Build main image images
      id: buildmainimage
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: |
        img=ghcr.io/${{github.repository}}:latest
        echo "IMAGE_NAME=${img}" >> "$GITHUB_OUTPUT"
        docker buildx build --push --cache-to type=gha,mode=max --cache-from type=gha --progress plain --platform linux/arm64/v8,linux/amd64 --build-arg BUILDKIT_INLINE_CACHE=1 -t ${img}  .

  # Every main commit becomes the next patch release once its image exists, so a deployment that
  # follows v0.1.* never points at a commit without an image. Minor and major releases are tags
  # pushed by hand on a main commit that is already built.
  release:
    needs: buildImages
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      FIRST_VERSION: v0.1.6
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # all tags, to find the latest release

    - name: Version
      id: version
      run: |
        semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
        if [ "${{ github.ref_type }}" = tag ]; then
          if ! grep -qE "$semver" <<<"$GITHUB_REF_NAME"; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z, not a release"
            exit 0
          fi
          version=$GITHUB_REF_NAME
        else
          if released=$(git tag --points-at HEAD | grep -E "$semver"); then
            echo "${GITHUB_SHA} is already released as ${released}"
            exit 0
          fi
          latest=$(git tag -l 'v*' | grep -E "$semver" | sort -V | tail -1)
          if [ -z "$latest" ]; then
            version=$FIRST_VERSION
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi
        fi
        echo "release ${version} of ${GITHUB_SHA}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Login to Container Registry
      if: ${{ steps.version.outputs.version }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # The image of the commit, also as :X.Y.Z (no "v", like most images). Deployments keep using
    # :<commit sha>; the version tag is for people.
    - name: Tag the image
      if: ${{ steps.version.outputs.version }}
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        img=ghcr.io/${{github.repository}}
        docker buildx imagetools create -t "${img}:${VERSION#v}" "${img}:${GITHUB_SHA}"

    # Last, so the git tag exists only once the image does. The tag is pushed with the
    # GITHUB_TOKEN, which starts no workflow: no second run for it.
    - name: Create the release
      if: ${{ steps.version.outputs.version }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if gh release view "$VERSION" >/dev/null 2>&1; then
          echo "release ${VERSION} exists"
          exit 0
        fi
        if [ "${{ github.ref_type }}" = tag ]; then
          gh release create "$VERSION" --verify-tag --generate-notes
        else
          gh release create "$VERSION" --target "$GITHUB_SHA" --generate-notes
        fi
