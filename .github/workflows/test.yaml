name: run tests

on:
  merge_group:
  pull_request:
    branches: [ "*" ]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:

  testGo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Golang caches
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-golang-

    # Test with the Go the image is built with. Dependabot bumps the golang tag in the Dockerfile;
    # go.mod's toolchain line is only the minimum.
    - name: Go version from the Dockerfile
      id: go
      run: echo "version=$(sed -n 's/^FROM golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"

    - name: Setup Golang
      uses: actions/setup-go@v7
      with:
        go-version: ${{ steps.go.outputs.version }}

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l $(git ls-files '*.go'))
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted (run gofmt -w):"
          echo "$unformatted"
          exit 1
        fi

    - name: go vet
      run: |
        go vet ./...
        go vet -tags functional ./test/functional/

    # Known vulnerabilities in the Go standard library and dependencies, reported only when our code
    # calls the affected function. Pinned so the tool doesn't change under the CI.
    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

    - name: Verify generated manifests
      run: make verify-manifests

    - name: run go tests
      env:
        RUN_INTEGRATION_TESTS: true
      run: |
        go test -v ./...
