name: run tests

on:
  merge_group:
  pull_request:
    branches: [ "*" ]

permissions:
  id-token: write

jobs:

  testGo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Golang caches
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-golang-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-golang-

    - name: Setup Golang
      uses: actions/setup-go@v6
      with:
        go-version-file: './go.mod'

    - name: run go tests
      env:
        RUN_INTEGRATION_TESTS: true
      run: |
        go test -v ./...
