# Go modules change only for security: no version updates (open-pull-requests-limit: 0), only
# the security updates Dependabot opens for an advisory (repository setting "Dependabot security
# updates"). dependabot-automerge.yaml merges such a PR only when govulncheck shows it fixes a
# vulnerability our code calls. Every merge to main is built and released as the next v0.1.N.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 0

  # The golang builder tag: the Go toolchain and standard library, where most of govulncheck's
  # findings are fixed. Patch updates merge automatically. ubuntu:latest and distroless
  # static:nonroot have no version to bump and are refreshed on every build.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC

  # One PR for all of them, never merged automatically. CI only: merging it makes no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
