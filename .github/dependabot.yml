# Weekly update PRs. Patch updates are approved and merged automatically once the tests pass
# (dependabot-automerge.yaml); every merge to main is built and released as the next v0.1.N.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    groups:
      # One PR for all patch updates. Only patches here, so the auto-merge sees a patch PR.
      patch:
        patterns: ["*"]
        update-types: [patch]
      # The Kubernetes libraries have to move together.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
        update-types: [minor]

  # The golang builder tag (Go toolchain and standard library). ubuntu:latest and
  # distroless static:nonroot have no version to bump and are refreshed on every build.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
