# More than one replica needs leaderElection.enabled: only the leader reconciles, the others wait
# and take over within seconds. A PodDisruptionBudget (maxUnavailable: 1) is added then.
replicaCount: 1

leaderElection:
  # --enable-leader-election, with a namespaced Role for the lease and its Events.
  enabled: false
image:
  fullyQualifiedURL: ghcr.io/adevinta/ingress-allowlisting-controller:de26113a795d2b7b4f9011ebf2c68a08117b613e

pullPolicy: IfNotPresent
# Memory: a remote CIDR source needs roughly 25-30x its body size while it is decoded and
# processed (the AWS ip-ranges.json feed, ~2.7 MB, needs ~50 MiB on top of the baseline).
# 256Mi fits the default cidrSource.maxResponseBytes (5 MiB); raise both together.
resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Liveness (/healthz) and readiness (/readyz) probes on :8081. They show the process serves
# requests, not that reconciles make progress.
probes:
  enabled: true

# The image (distroless, USER nonroot) runs as UID 65532. runAsUser must be numeric: the kubelet
# can't check a user name against runAsNonRoot. The controller writes nothing to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# NetworkPolicy for the controller's own pod (ingress only). Off by default: many platforms
# already isolate namespaces, check before enabling. When enabled, the probe port stays open and
# only metricsFrom can reach the metrics port (:8080, plain HTTP without authentication); with an
# empty metricsFrom nobody can scrape it.
podNetworkPolicy:
  enabled: false
  # NetworkPolicy "from" peers allowed to reach the metrics port, e.g.
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: monitoring
  metricsFrom: []

vpa:
  updateMode: "Recreate"
  containerPolicy:
    maxAllowed:
      cpu: "1"
      memory: "1Gi"
    minAllowed:
      cpu: 100m
      memory: 256Mi   # below this a remote source at the default size cap can OOM the pod

ingress:
  enabled: true

gateway:
  enabled: false

httproute:
  enabled: false
  labelSelector: ""

networkpolicy:
  enabled: false

service:
  enabled: false

podMonitor:
  additionalLabels: {}

nodeSelector: {}

affinity: {}

tolerations: []

annotationPrefix: "ipam.adevinta.com"
httpHeadersEnabled: true
secretLabelSelector: ""

# Guardrails for CIDRs/ClusterCIDRs fetched from a remote source (spec.cidrsSource.location.uri).
# Every key is optional: leave it unset to use the controller default shown here. These are
# protections, so raising a value widens the blast radius of a broken or misbehaving feed.
# They never apply to inline spec.cidrs.
cidrSource: {}
  # minMaskIPv4: 8                # widest IPv4 prefix accepted (1-32); wider prefixes reject the fetch
  # minMaskIPv6: 20               # widest IPv6 prefix accepted (1-128)
  # fetchTimeout: 30s             # whole fetch: connect, headers, body and processing
  # maxResponseBytes: 5242880     # 5 MiB; a larger body fails the fetch (never truncated).
  #                               # Needs ~25-30x in pod memory: raise resources.limits.memory with it
  # celCostLimit: 1000000         # max estimated cost of one CEL evaluation
  # retryInterval: 5m             # how soon a failed fetch is retried (a shorter requeueAfter wins)
  #
  # Where a source may be fetched from. Both are about the SSRF exposure of `location.uri`:
  # allowlist:                      # origins a source may be fetched from, scheme://host[:port]
  #   - https://ip-ranges.amazonaws.com   # bare "host" means https; list http:// separately if needed
  #   - https://api.github.com            # exact host match: no wildcards, no path/prefix matching
  #                                       # empty (default) = ANY host allowed; the controller logs a warning
  # allowPrivateDestinations: false # default false: connections to loopback, link-local (cloud
  #                                 # metadata), private and CGNAT addresses are refused. Set true
  #                                 # only for feeds that are really internal.
