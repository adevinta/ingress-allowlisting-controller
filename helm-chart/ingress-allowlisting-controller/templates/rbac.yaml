# The controller's own permissions, bound to its ServiceAccount only. Not aggregated into the
# default roles: whoever holds edit/admin would get them too (writing AuthorizationPolicies,
# Middlewares, CIDRs status, ClusterCIDRs). Users get the -cidrs-editor/-cidrs-viewer roles below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
rules:
- apiGroups: 
  - "ipam.adevinta.com"
  resources:
  - "cidrs"
  - "clustercidrs"
  - "cidrs/status"
  - "clustercidrs/status"
  verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- if .Values.ingress.enabled }}
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["list", "get", "update", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list", "get", "update", "watch"]
{{- end }}
{{- if .Values.networkpolicy.enabled }}
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["list", "get", "update", "watch"]
{{- end }}
{{- if .Values.service.enabled }}
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list", "get", "update", "watch"]
{{- end }}
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list","get", "update", "create", "watch"]
{{- if .Values.httpHeadersEnabled }}
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "watch", "list"]
{{- end }}
{{- if .Values.gateway.enabled }}
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "gatewayclasses"]
  verbs: ["list","get", "watch"]
- apiGroups: ["security.istio.io"]
  resources: ["authorizationpolicies"]
  verbs: ["list", "get", "watch", "create", "update", "delete", "patch"]
{{- end }}
{{- if .Values.httproute.enabled }}
# patch: the Traefik writer adds and removes its Middleware filter on the route with a patch.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["list", "get", "watch", "update", "patch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "gatewayclasses"]
  verbs: ["list", "get", "watch"]
# Namespace labels for the Gateways' allowedRoutes namespace selectors (read on demand, no watch).
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
- apiGroups: ["security.istio.io"]
  resources: ["authorizationpolicies"]
  verbs: ["list", "get", "watch", "create", "update", "delete", "patch"]
- apiGroups: ["traefik.io"]
  resources: ["middlewares"]
  verbs: ["list", "get", "watch", "create", "update", "delete"]
{{- end }}
---
# Namespace editors and admins manage the CIDRs of their namespace. Not the status (the
# controller writes it) and not ClusterCIDRs (cluster-wide; grant them explicitly).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cidrs-editor
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["ipam.adevinta.com"]
  resources: ["cidrs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Read access for view (and so edit and admin, which include view).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cidrs-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["ipam.adevinta.com"]
  resources: ["cidrs", "cidrs/status", "clustercidrs", "clustercidrs/status"]
  verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ .Release.Name }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ .Release.Name }}
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
