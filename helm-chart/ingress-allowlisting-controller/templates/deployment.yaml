apiVersion: {{ include "deployment.apiVersion" $ }}
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    chart: "{{ .Chart.Name }}"
    app.kubernetes.io/name: "{{ .Release.Name }}"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ .Release.Name }}"
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ .Release.Name }}"
    spec:
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 6 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
      serviceAccountName: {{ .Release.Name }}
{{- with .Values.podSecurityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: {{ .Values.image.fullyQualifiedURL }}
        imagePullPolicy: {{ .Values.pullPolicy }}
        args:
{{- if .Values.ingress.enabled }}
        - "--ingress-support-enabled"
{{- end }}
{{- if .Values.gateway.enabled }}
        - "--gateway-support-enabled"
{{- end }}
{{- if .Values.networkpolicy.enabled }}
        - "--networkpolicy-support-enabled"
{{- end }}
{{- if .Values.service.enabled }}
        - "--service-support-enabled"
{{- end }}
{{- if .Values.httproute.enabled }}
        - "--httproute-support-enabled"
{{- with .Values.httproute.labelSelector }}
        - "--httproute-label-selector={{ . }}"
{{- end }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
        - "--enable-leader-election"
{{- end }}
{{- with .Values.logLevel }}
        - "--log-level={{ . }}"
{{- end }}
{{- with .Values.annotationPrefix }}
        - "--annotation-prefix={{ . }}"
{{- end }}
{{- if .Values.httpHeadersEnabled }}
        - "--http-headers-enabled"
{{- end }}
{{- if and .Values.httpHeadersEnabled .Values.secretLabelSelector }}
        - "--secret-label-selector={{ .Values.secretLabelSelector }}"
{{- end }}
{{- with .Values.cidrSource }}
{{- with .minMaskIPv4 }}
        - "--cidr-source-min-mask-ipv4={{ . | int }}"
{{- end }}
{{- with .minMaskIPv6 }}
        - "--cidr-source-min-mask-ipv6={{ . | int }}"
{{- end }}
{{- with .fetchTimeout }}
        - "--cidr-source-fetch-timeout={{ . }}"
{{- end }}
{{- with .maxResponseBytes }}
        - "--cidr-source-max-response-bytes={{ . | int64 }}"
{{- end }}
{{- with .celCostLimit }}
        - "--cidr-source-cel-cost-limit={{ . | int64 }}"
{{- end }}
{{- with .retryInterval }}
        - "--cidr-source-retry-interval={{ . }}"
{{- end }}
{{- range .allowlist }}
        - "--cidr-source-allowlist={{ . }}"
{{- end }}
{{- if .allowPrivateDestinations }}
        - "--cidr-source-allow-private-destinations"
{{- end }}
{{- end }}
        env:
        # Lets the Go GC work harder as the heap nears the container limit instead of being
        # OOM-killed while a large remote CIDR source is being processed. Without a memory limit it
        # resolves to the node's allocatable memory.
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
        ports:
        - containerPort: 8080
{{- if .Values.probes.enabled }}
        # The probes use :8081 (--health-probe-bind-address). It is not listed in ports on purpose:
        # the PodMonitor scrapes every listed port, and 8081 has no /metrics.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
{{- end }}
{{- with .Values.securityContext }}
        securityContext:
{{ toYaml . | indent 10 }}
{{- end }}
        resources:
{{ toYaml .Values.resources | indent 12 }}
